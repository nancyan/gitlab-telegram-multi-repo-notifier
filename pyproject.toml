[project]
name = "gitlab-telegram-multi-repo-notifier"
version = "0.1.0"
description = "Personal and shared Telegram notifications for multiple GitLab projects"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

